name: Build and Push Nginx Docker Image

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: "Nginx version (leave empty for latest mainline)"
        required: false
        type: string
  push:
    branches: [ "main" ]
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: docker-build
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: madwind/nginx

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.nginx_version }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - name: Resolve nginx version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.nginx_version || '' }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION=$(
              curl -fsSL https://nginx.org/en/download.html |
                sed -n '/Mainline version/,/Stable version/p' |
                grep -oE 'nginx-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' |
                sed -n '1{s/^nginx-//; s/\.tar\.gz$//; p}'
            )
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid nginx version: $VERSION" >&2
            exit 1
          fi

          echo "Nginx version: $VERSION"
          echo "nginx_version=$VERSION" >> "$GITHUB_OUTPUT"

          if ! docker manifest inspect "nginx:${VERSION}" >/dev/null 2>&1; then
            echo "nginx:${VERSION} is not available on Docker Hub yet; skipping this run."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && \
             docker manifest inspect "${REGISTRY_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "${REGISTRY_IMAGE}:${VERSION} already exists; nothing to rebuild."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    if: needs.prepare.outputs.should_build == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          build-args: |
            NGINX_VERSION=${{ needs.prepare.outputs.app_version }}
            GEOIPUPDATE_ACCOUNT_ID=${{ secrets.GEOIPUPDATE_ACCOUNT_ID }}
            GEOIPUPDATE_LICENSE_KEY=${{ secrets.GEOIPUPDATE_LICENSE_KEY }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
        env:
          BUILDKIT_PROGRESS: plain
          DOCKER_BUILDKIT: 1
          BUILDKIT_DEBUG: 1

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            -t ${{ env.REGISTRY_IMAGE }}:${{ env.APP_VERSION }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
