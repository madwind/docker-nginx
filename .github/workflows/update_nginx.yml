name: Update Nginx Version

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: nginx-version-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Check latest mainline version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT=$(sed -n 's/^ARG NGINX_VERSION=//p' Dockerfile | sed -n '1p')
          LATEST=$(
            curl -fsSL https://nginx.org/en/download.html |
              sed -n '/Mainline version/,/Stable version/p' |
              grep -oE 'nginx-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' |
              sed -n '1{s/^nginx-//; s/\.tar\.gz$//; p}'
          )

          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid current nginx version: $CURRENT" >&2
            exit 1
          fi

          if [[ ! "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine latest nginx mainline version" >&2
            exit 1
          fi

          echo "Current nginx version: $CURRENT"
          echo "Latest nginx mainline version: $LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if ! dpkg --compare-versions "$LATEST" gt "$CURRENT"; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! docker manifest inspect "nginx:${LATEST}" >/dev/null 2>&1; then
            echo "nginx:${LATEST} is not available on Docker Hub yet; retrying on the next run."
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "update=true" >> "$GITHUB_OUTPUT"

      - name: Update Dockerfile
        if: steps.version.outputs.update == 'true'
        env:
          NGINX_VERSION: ${{ steps.version.outputs.latest }}
        run: |
          sed -i -E "s/^ARG NGINX_VERSION=.*/ARG NGINX_VERSION=${NGINX_VERSION}/" Dockerfile
          git diff --check
          git diff -- Dockerfile

      - name: Commit and push
        if: steps.version.outputs.update == 'true'
        env:
          NGINX_VERSION: ${{ steps.version.outputs.latest }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "chore: update nginx to ${NGINX_VERSION}"
          git push origin "HEAD:${BRANCH}"

      # Pushes made with GITHUB_TOKEN do not trigger push workflows, so dispatch the build explicitly.
      - name: Trigger image build
        if: steps.version.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run publish_docker.yml --ref "$BRANCH"
